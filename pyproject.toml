[project]
name = "fauxtography"
version = "0.1.0"
description = "Detect whether an image is a real photograph or AI-generated (baseline ResNet vs CLIP vs DINOv2)."
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Manos (suprch4rg3d)" }, { name = "Demetra (DemetraP20)" }]
dependencies = [
    "torch>=2.15",
    "torchvision>=0.29",
    "transformers>=5.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"
