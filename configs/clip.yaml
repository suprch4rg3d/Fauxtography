# CLIP zero-shot
model_name: openai/clip-vit-base-patch32
batch_size: 64
num_workers: 4

prompts_real:
  - "a real photograph taken with a camera"
  - "a genuine photo of a real scene"

prompts_fake:
  - "an image generated by artificial intelligence"
  - "a fake AI-generated image"

data:
  root: data
  image_size: 224
  num_workers: 4
  seed: 42

output:
  run_dir: experiments/runs
  results_dir: results
  report_name: metrics